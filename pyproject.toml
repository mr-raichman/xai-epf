[project]
name = "epf"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for the Spanish market, and what the models learn about how the price forms."
requires-python = "==3.13.*"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "threadpoolctl==3.6.0",
    "lightgbm==4.7.0",
    "shap==0.52.0",
    "matplotlib==3.11.2",
    "joblib==1.6.0",
    # La xarxa de Lago et al. (2021) i la cerca dels seus hiperparàmetres. Sense
    # `[and-cuda]`: aquells paquets són de Linux i d'NVIDIA, i el projecte s'ha
    # d'instal·lar en una màquina qualsevol.
    "tensorflow==2.21.0",
    "optuna==5.0.0",
]

# Tot el que es tecleja a mà, en una sola ordre: `epf --help` és la llista.
[project.scripts]
epf = "epf.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epf"]

[tool.ruff.lint]
# Regles fixades, no les per defecte de ruff, que canvien entre versions. Només
# pyflakes i les regles E de correcció, no d'estil.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Només les proves de tests/.
testpaths = ["tests"]
addopts = "-q"
