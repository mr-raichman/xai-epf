[project]
name = "epf"
version = "0.1.0"
# La frase del docstring del paquet, `epf/__init__.py`, copiada a propòsit: s'han de
# mantenir iguals.
description = "Predicció del preu diari del mercat elèctric espanyol i estudi de la seva formació."
requires-python = "==3.13.*"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "shap==0.52.0",
    "matplotlib==3.11.2",
    # Les xarxes de Marcjasz et al. (2023) i la cerca dels seus hiperparàmetres. Sense
    # `[and-cuda]`: aquells paquets són de Linux i d'NVIDIA, i el projecte s'ha
    # d'instal·lar en una màquina qualsevol.
    "tensorflow==2.21.0",
    "optuna==5.0.0",
    "scipy==1.18.1",
]

# Tot el que es tecleja a mà, en una sola ordre: `epf --help` és la llista.
[project.scripts]
epf = "epf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.16.1",
    # Només per a una prova: el Ljung-Box dels residus contra una implementació que no és
    # la del projecte.
    "statsmodels==0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epf"]

[tool.ruff.lint]
# Regles fixades, no les per defecte de ruff, que canvien entre versions: pyflakes, les
# regles E de correcció i E501, la llargada de línia, l'única d'estil, perquè `ruff
# format` no parteix els comentaris ni els docstrings.
select = ["E4", "E7", "E9", "E501", "F"]

[tool.pytest.ini_options]
# Només les proves de tests/.
testpaths = ["tests"]
addopts = "-q"
