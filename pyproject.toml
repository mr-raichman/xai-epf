[project]
name = "epf"
version = "0.1.0"
# La frase del docstring del paquet, `epf/__init__.py`, copiada a propòsit: s'han de
# mantenir iguals.
description = "Aportació a l'heurística apresa en la predicció del preu del mercat elèctric diari espanyol mitjançant aprenentatge automàtic."
requires-python = "==3.13.*"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "shap==0.52.0",
    "matplotlib==3.11.2",
    # Les xarxes de Marcjasz et al. (2023) i la cerca dels seus hiperparàmetres.
    # `tensorflow-cpu`, la compilació només per a CPU, perquè les xarxes s'ajusten a la
    # CPU i aquesta no busca CUDA en arrencar; no es publica per a macOS ni per a Linux
    # ARM, on hi va `tensorflow`.
    "tensorflow-cpu==2.21.0 ; platform_machine != 'aarch64' and sys_platform != 'darwin'",
    "tensorflow==2.21.0 ; platform_machine == 'aarch64' or sys_platform == 'darwin'",
    "optuna==5.0.0",
    "scipy==1.18.1",
]

# Tot el que es tecleja a mà, en una sola comanda: `epf --help` és la llista.
[project.scripts]
epf = "epf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.16.1",
    # Només per a una prova: el Ljung-Box dels errors contra una implementació que no és
    # la del projecte.
    "statsmodels==0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epf"]

[tool.ruff.lint]
# Regles fixades, no les per defecte de ruff, que canvien entre versions: pyflakes, les
# regles E de correcció i E501, la llargada de línia, l'única d'estil, perquè `ruff
# format` no parteix els comentaris ni els docstrings.
select = ["E4", "E7", "E9", "E501", "F"]

[tool.pytest.ini_options]
# Només les proves de tests/.
testpaths = ["tests"]
addopts = "-q"
# Tot avís és un error, llevat dels coneguts de les biblioteques.
filterwarnings = [
    "error",
    # Com a error, AutoGraph l'atrapa i deixa sense convertir el gradient de
    # DeepExplainer, sense que cap prova falli.
    "ignore:.*got an unexpected keyword argument '___pyct_anno':DeprecationWarning",
    # Només amb les dades petites de les proves.
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore:The structure of `inputs` doesn't match the expected structure:UserWarning",
    "ignore:Your TensorFlow version is newer than 2.4.0:UserWarning",
    "ignore:The set_(bad|over|under) function will be deprecated:PendingDeprecationWarning",
    # Les connexions d'SQLite dels studies d'Optuna, que tanca el recol·lector.
    "ignore:unclosed database:ResourceWarning",
]
