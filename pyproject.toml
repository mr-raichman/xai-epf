[project]
name = "epf"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for the Spanish market, and what the models learn about how the price forms."
requires-python = "==3.13.*"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "xgboost==3.4.1",
    "shap==0.52.0",
    "matplotlib==3.11.2",
]

[project.scripts]
epf-download = "epf.data.omie:download"

[dependency-groups]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epf"]

[tool.ruff.lint]
# Regles fixades, no les per defecte de ruff, que canvien entre versions. Només
# pyflakes i les regles E de correcció, no d'estil.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Només les proves de tests/. Els scripts de tools/ no són proves.
testpaths = ["tests"]
addopts = "-q"
