[project]
name = "epf"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for the Spanish market, and what the models learn about how the price forms."
requires-python = "==3.13.*"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "threadpoolctl==3.6.0",
    "lightgbm==4.7.0",
    "shap==0.52.0",
    "matplotlib==3.11.2",
]

# Tot el que es tecleja a mà. El caminant no hi és: l'executa `epf-run`, que viu
# fora del projecte perquè avisa quan acaba.
[project.scripts]
epf-price = "epf.data.price:main"
epf-audit-data = "epf.data.audit:main"
epf-show-run = "epf.results.show_run:main"
epf-show-figures = "epf.results.show_figures:main"
epf-figure-price = "epf.data.figures.price.price:main"
epf-figure-outliers = "epf.data.figures.price.outliers:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epf"]

[tool.ruff.lint]
# Regles fixades, no les per defecte de ruff, que canvien entre versions. Només
# pyflakes i les regles E de correcció, no d'estil.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Només les proves de tests/. Els scripts de tools/ no són proves.
testpaths = ["tests"]
addopts = "-q"
